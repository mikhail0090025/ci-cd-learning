name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}  # Исправлено
        password: ${{ secrets.DOCKER_HUB_TOKEN }}     # Исправлено

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/my-container:latest .
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/my-container:latest

    - name: Run tests
      run: |
        docker run --rm ${{ secrets.DOCKER_HUB_USERNAME }}/my-container:latest python -c "import tensorflow; import numpy; print('Tests passed!')"